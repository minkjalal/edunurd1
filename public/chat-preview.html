<!-- Function: Provides a standalone preview shell for the community chat experience. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EduNerd - Community Real-Time Chat (Discord Sidecar Preview)</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1015;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: #e3e5e8;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 20px;
      background: #1e1f22;
      border-bottom: 1px solid #2b2d31;
      font-size: 14px;
    }
    .top-bar a {
      color: #5865f2;
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .top-bar a:hover {
      text-decoration: underline;
    }
    .badge {
      background: #23a55a;
      color: white;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    #chat-container {
      flex: 1;
      height: calc(100vh - 45px);
      width: 100%;
      position: relative;
    }
    #ag-discord-mount {
      height: 100%;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div style="display:flex; align-items:center; gap: 12px;">
      <a href="/">← Return to EduNerd Main App</a>
      <span style="color:#949ba4;">|</span>
      <span>Community Zone: <strong>Real-Time Discord-like Chat Sidecar</strong></span>
    </div>
    <div style="display:flex; align-items:center; gap: 10px;">
      <span class="badge">Sidecar Microservice Active :3001</span>
      <span style="color:#949ba4; font-size: 12px;">WebSocket: /ws/chat</span>
    </div>
  </div>

  <div id="chat-container">
    <div id="ag-discord-mount"></div>
  </div>

  <!-- Drop-in Community Discord-like Chat Widget Bundle -->
  <script src="/ag-discord-widget.js"></script>
</body>
</html>
